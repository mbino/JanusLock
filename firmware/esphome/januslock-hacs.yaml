# JanusLock device config for the Home Assistant "ESPHome Device Builder" add-on.
# This variant pulls the external component straight from GitHub, so you don't need the
# component files locally. Create a new device with this YAML and fill secrets.yaml.
substitutions:
  name: januslock

esphome:
  name: ${name}

esp32:
  board: esp32-poe
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/mbino/JanusLock
      ref: main
    path: firmware/esphome/components
    components: [janus_lock]
    refresh: 1d

esp32_ble_tracker:

ble_client:
  - mac_address: !secret lock_mac
    id: janus_ble

janus_lock:
  id: janus_hub
  ble_client_id: janus_ble
  master_token: !secret janus_master_token
  update_interval: 12h   # periodic status wake; connect-on-demand otherwise
  battery_level:
    name: "Slot batterij"
  normal_lock:
    name: "Deurkruk-modus actief"
  auto_lock:
    name: "Auto-lock"
  lock_sound:
    name: "Slotgeluid"
  calibrated:
    name: "Gekalibreerd"

lock:
  - platform: janus_lock
    janus_lock_id: janus_hub
    name: "Kantoor slot"

switch:
  - platform: janus_lock
    janus_lock_id: janus_hub
    name: "Deurkruk-modus"
