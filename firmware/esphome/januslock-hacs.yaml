# JanusLock device config for the Home Assistant "ESPHome Device Builder" add-on.
# This variant pulls the external component straight from GitHub, so you don't need the
# component files locally. Create a new device with this YAML and fill secrets.yaml.
substitutions:
  name: januslock

esphome:
  name: ${name}

esp32:
  board: esp32-poe
  framework:
    type: esp-idf

logger:
api:
  services:
    - service: provision_passcode
      variables:
        token_raw: string
        token_id: int
        passcode: string
      then:
        - lambda: 'id(janus_hub).provision_passcode(token_raw, token_id, passcode);'
    - service: remove_passcode
      variables:
        token_id: int
      then:
        - lambda: 'id(janus_hub).remove_passcode(token_id);'
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/mbino/JanusLock
      ref: main
      path: firmware/esphome/components
    components: [janus_lock]
    refresh: 1d   # set to "always" while developing to re-pull every build

esp32_ble_tracker:

ble_client:
  - mac_address: !secret lock_mac
    id: janus_ble

janus_lock:
  id: janus_hub
  ble_client_id: janus_ble
  master_token: !secret janus_master_token
  update_interval: 12h   # periodic status wake; connect-on-demand otherwise
  battery_level:
    name: "Lock battery"
  calibrated:
    name: "Calibrated"

button:
  - platform: janus_lock
    janus_lock_id: janus_hub
    action: unlock
    name: "Unlock"

switch:
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: passage
    name: "Passage mode"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: auto_lock
    name: "Auto-lock"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: lock_sound
    name: "Lock sound"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: break_in_alarm
    name: "Break-in alarm"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: button_enabled
    name: "Button lock"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: unlatch
    name: "Unlatch"
