# JanusLock — ESPHome external component (Olimex ESP32-PoE2 by the door).
# WiFi phase; add the `ethernet:` block for PoE later.
substitutions:
  name: januslock

esphome:
  name: ${name}

esp32:
  board: esp32-poe
  framework:
    type: esp-idf

logger:
api:
  services:
    - service: provision_passcode
      variables:
        token_raw: string
        token_id: int
        passcode: string
      then:
        - lambda: 'id(janus_hub).provision_passcode(token_raw, token_id, passcode);'
    - service: remove_passcode
      variables:
        token_id: int
      then:
        - lambda: 'id(janus_hub).remove_passcode(token_id);'
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    components: [janus_lock]

esp32_ble_tracker:

ble_client:
  - mac_address: !secret lock_mac
    id: janus_ble

janus_lock:
  id: janus_hub
  ble_client_id: janus_ble
  master_token: !secret janus_master_token
  update_interval: 12h   # periodic status wake; battery-friendly (connect-on-demand otherwise)
  battery_level:
    name: "Slot batterij"
  calibrated:
    name: "Gekalibreerd"

button:
  - platform: janus_lock
    janus_lock_id: janus_hub
    action: unlock
    name: "Ontgrendelen"

switch:
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: passage
    name: "Deurkruk-modus"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: auto_lock
    name: "Auto-lock"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: lock_sound
    name: "Slotgeluid"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: break_in_alarm
    name: "Inbraakalarm"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: button_enabled
    name: "Knop-vergrendeling"
  - platform: janus_lock
    janus_lock_id: janus_hub
    setting: unlatch
    name: "Unlatch"
