; JanusLock PoC firmware — proves the BLE protocol (handshake -> challenge -> unlock)
; Target: Olimex ESP32-PoE2 (WiFi phase; Ethernet/PoE added later).
[env:esp32-poe]
platform = espressif32
board = esp32-poe
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
upload_speed = 460800
board_build.partitions = min_spiffs.csv
lib_deps = h2zero/NimBLE-Arduino@^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=2
